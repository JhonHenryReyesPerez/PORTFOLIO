spring.application.name=portfolio-api

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
server.shutdown=graceful
spring.threads.virtual.enabled=true

# Asistente
assistant.site-url=https://jhonhenryreyesperez.github.io/PORTFOLIO/
assistant.allowed-origins=${ASSISTANT_ALLOWED_ORIGINS:https://jhonhenryreyesperez.github.io,http://localhost:5500,http://127.0.0.1:5500}
assistant.max-history=8
assistant.per-client.max-requests=15
assistant.per-client.window=10m
assistant.global.max-requests=300
assistant.global.window=1d

# DeepSeek (la clave nunca se escribe aquí: llega por la variable de entorno)
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.max-tokens=350
deepseek.temperature=0.4
deepseek.timeout=25s
